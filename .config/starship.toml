"$schema" = "https://starship.rs/config-schema.json"

# Powerline layout mirroring the tmux status bar:
# red block (directory) -> blue block (git) -> dark block (languages/duration)
format = """
[](red)\
$directory\
[](fg:red bg:blue)\
$git_branch\
$git_status\
[](fg:blue bg:sumi)\
$nodejs\
$bun\
$python\
$rust\
$golang\
$php\
$java\
$docker_context\
$cmd_duration\
[](fg:sumi)\
$line_break\
$character"""

palette = "kanagawa_dragon"

# themes/kanagawa-dragon.md
[palettes.kanagawa_dragon]
black = "#0d0c0c"       # dragonBlack0
sumi = "#252535"        # tmux message/inactive window bg
red = "#c4746e"         # dragonRed
blue = "#8ba4b0"        # dragonBlue
green = "#87a987"       # dragonGreen
yellow = "#c4b28a"      # dragonYellow
violet = "#8992a7"      # dragonViolet

[directory]
style = "fg:black bg:red"
read_only_style = "fg:black bg:red"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " "
truncation_length = 1

[git_branch]
symbol = ""
style = "fg:black bg:blue"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:black bg:blue bold"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[bun]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version)( \\($virtualenv\\)) ]($style)"

[rust]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[php]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[java]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = ""
style = "fg:blue bg:sumi"
format = "[ $symbol $context ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:yellow bg:sumi"
format = "[  $duration ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold violet)"
